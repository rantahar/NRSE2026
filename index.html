        Keeping track of study participants seems like common problem, one that should have an open source

        - data sovereignty built in
        - support for handling several data sources
        - separation between researchers and data administrator

        What do you use to solve this problem?


        Intro: the problem 5 minutes
         - Study with human participants
         - Participants create accounts, we need to keep track of them
         - Send email, ask for survey answers, samples, and so on
         - No open source solution?

         - Participant login
         - Email
         - Configurable data sources

            # tracking Study Participants
            Jarno Rantaharju - June 10, 2026

            ---
            
            ## The problem

            - Study that has human participants
            - Collects data about those participants over time

            ---

            ## The problem

            ### Possible data sources
            - Survey responses
            - Device data
            - Behavior
            - Samples ...

            ---

            ## The problem

            ### Participant management
            - Check who needs help with setup
            - Survey reminders
            - Send information email
            - Check data collection status
            

            ---

            ##  The problem

            - No open source solution?

            ---

            ## Requirements

            So we've built a solutions a few time over. What are the requirements?

            - Participant login
            - Configurable data sources
            - Data sovereignty
            
            ---

            ## Requirements

            ### Login and roles

            - Participants create their own account
            - And control their own information
            - Must track consent and data sharing preferences
            - Researcher accounts
            - Data administrator

            ---

            ## Requirements

            ### Data sources

            - Should be easy to add per study
            - Clear consent flow for different types of data
            - Visible to the participant
            - Unified interface for researchers

            ---

            ## Requirements

            ### Data sovereignty

            - Data primarily owned by the participant
            - Participants can download their data
            - Participants can delete their data
            - Researcher access depends on consent

            ---

            ## The study server

            - Built in Django
            - Currently included data sources:
              - Survey responses
              - Google and TikTok exports (using Niimport)
              - Aware framework for device data collection
            - Data sources are Django apps

            ---

            ### The study server

            - One study object
            - Data source configurations
            - Participant sign up creates consent objects for each data source
            - Data source itself created by the participant, and linked to the consent

            ---
