        <!-- 
        20 minutes in schedule, 5 minutes for questions.


        Keeping track of study participants seems like common problem, one that should have an open source
        solution by now. I could not find a satisfactory one, and built one in Django instead. It has
        - data sovereignty built in
        - support for handling several data sources
        - separation between researchers and data administrator

        What do you use to solve this problem?


        Intro: the problem 5 minutes
         - Study with human participants
         - Participants create accounts, we need to keep track of them
         - Send email, ask for survey answers, samples, and so on
         - Collect data from diverse sources and unify
         - No open source solution?


        Study server
          - Django
          - Data sources are Django apps
          - Data sovereignty

        Participant workflows
          - Creates an account and joins the study
          - Study front page infromation sheet, consents per data source
          - Dashboard with status, set up instructions, and data download
          - Data visible to participant, can download it, and delete it

        Data sources
          - Django apps, simple plugin system
          - Built in:
            - Survey responses
            - Google and TikTok exports (using Niimport)
            - Aware framework for device data collection
          - Researchers set up configurations

        -->

            # tracking Study Participants
            Jarno Rantaharju - June 10, 2026

            ---
            
            ## The problem

            - Study that has human participants
            - Collects data about those participants over time
            - Sign up and manage your participants
            - Data sovereigny and security

            ---

            ## The problem

            ### Possible data sources

                    <img src="timeline.jpeg" alt="Persons route on a map" style="width: 70%;">
              </div>

            ---

            ## Study Server

            - No open source solution?

            - Built in Django
            - Standard login system with custom data
            - Data sources are Django apps
            - Data linked to participants through consents
            
            ---

            ### Participant

            [Demo](http://localhost:8000)

            - Creates an account and joins the study
            - Consents to each data source
            - Gets set up instructionss for each source
            - Sees the data and can download it
            - Can delete their data or withdraw

            ---
            
            ### Researcher

            - Configures the study
            - Sets up data source configurations
            - Creates a study page
            - Writes consent forms
            - Sees participant ids but not identifying information
            - Can send reminders or contact participants

            ---

            ### Data administrator

            - Separate role from researchers
            - Manages the server
            - Researchers do not need account information
            - Or identifiers removed from the data.

            ---

            ### Data flows

            - One study object
            - Data source configurations
            - Participant sign up creates consent objects for each data source
            - Data source itself created by the participant, and linked to the consent

            ---
