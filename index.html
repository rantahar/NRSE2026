        <!-- 
        20 minutes in schedule, 5 minutes for questions.


        Seemingly common problem: Studies with many human participants. I have written a
        server to track participants for a couple of studies now, and there should be an
        open source solution. I'm writing an implementation that fits all these previous
        cases.

        Also based on Koota

        What is needed? This will be a solution for a particular type of study, is there
        a class of problems I am ignoring?

        - Privacy and security
        - Participant owns their data:
          - Creates an account and controls their consents and data sources
          - Can see and download their own data
        - Researcher biew:
          - Configuration
          - Data download and mark for deletion
          - Contact participants
          - No identifying information, only participant ids
        - Data administrator separete from researchers
        - System administrator conceptually separate


        Intro: 5 minutes
         - Study with human participants
         - Participant tracking (consent, status, contact information...)
         - Data collection (multiple sources...)
         - Data sovereignty and security
         - Reoccuring study type, but no open source solution?

        Study server
          - Django
          - Data sources are Django apps
          - Data sovereignty

        Participant workflows
          - Creates an account and joins the study
          - Study front page infromation sheet, consents per data source
          - Dashboard with status, set up instructions, and data download
          - Data visible to participant, can download it, and delete it

        Data sources
          - Django apps, simple plugin system
          - Built in:
            - Survey responses
            - Google and TikTok exports (using Niimport)
            - Aware framework for device data collection
          - Researchers set up configurations

        -->

            ## tracking Study Participants
            
            Jarno Rantaharju - June 10, 2026

            ---
            
            ## The problem

             - Manage participant details
               - Consent information
               - Contact information
               - Participant status
             - Data sovereignty and security

            ---


            ### Data sources

            <div style="display: flex;">
              <div style="flex: 1;">
                  <img src="data_sources.svg" alt="Picture of data flows in the study server" style="width: 60%;">
              </div>
            </div>

            ---

            ## The problem

            - Rule of 2: 
            </br> Next time I should not need to start from zero
            - Done before in [Koota](https://github.com/digitraceslab/koota-server)
            - and probably many other local implementations

            ---

            ## Study Server

            - Django
            - Comes with:
              - Login and user management
              - Security features
              - Admin interface

            ---

            ## Study Server

            We add:
            
            - Profile information stored separately
            - Replaced identifiers in data
            - More stringent security
            - Data source plugin system

            ---

            ### Data Sources and Consents
            
            We add:
            - Source configurations (researcher)
            - Consents
            - Data sources (participant)

            ---

            ### Data Sources and Consents

            <div style="display: flex;">
              <div style="flex: 1;">
                  <img src="study_server_classes.svg" alt="Class relationships in the study server" style="width: 75%;">
              </div>
            </div>

            ---

            ### Researcher

            [Demo](http://localhost:8000)

            - Configures the study
            - Sets up data source configurations
            - Creates a study page
            - Writes consent forms
            - Sees participant ids but not identifying information
            - Can send reminders or contact participants
            
            ---

            ### Participant

            [Demo](http://localhost:8000)

            - Creates an account and joins the study
            - Consents to each data source
            - Gets set up instructions for each source
            - Sees the data and can download it
            - Can delete their data or withdraw 


            ---

            ### Data Sources and Consents
            
            - Data source configurations
               - set up by the reseachers
               - what data source are required for the study
               - consent forms

            ---

            ### Data Sources and Consents
            
            - Consent
               - connects participant, study and data source
               - tracks what the participant consented to

            ---
            
            ### Data Sources and Consents

            - Data source tells the server
              - instructions to give participants
              - what types of data exist
              - how to pull data

            - Custom admin interface

            ---

            ### Data administrator

            - Separate role from researchers
            - Manages the server
            - Researchers do not need account information
            - Or identifiers removed from the data.

            ---

            ### Data Sources

            - We currently support:
              - Surveys
              - Google and TikTok portability API (using Niimport)
              - Aware framework for phone data collection


            ---
